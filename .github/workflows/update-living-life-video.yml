name: Update Living Life video

on:
  schedule:
    # Daily at 00:05 Asia/Seoul, with a fallback check at 00:30.
    # An already-current video skips installation, build, and commit.
    - cron: "5 15 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-living-life-video
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update Living Life video
        run: npm run update:living-life-video

      - name: Check for source changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/app/l/page.tsx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Test updater
        if: steps.changes.outputs.changed == 'true'
        run: npm test -- scripts/living-life-video.test.mjs

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit and push update
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/l/page.tsx
          git commit -m "Update Living Life video for $(TZ=Asia/Seoul date +%F)"
          git push
